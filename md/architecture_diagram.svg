<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 960"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="960" fill="url(#bg-grad)" rx="12"/>
  <rect x="1" y="1" width="858" height="958" fill="none" stroke="#E2E8F0" rx="12" stroke-width="1"/>

  <!-- ===== TITLE ===== -->
  <text x="420" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1E293B"
        letter-spacing="-0.3">ArVee Agent Architecture</text>
  <text x="420" y="50" text-anchor="middle" font-size="12" fill="#64748B">
    Receipt Validator — Query Processing Pipeline</text>

  <!-- ===== 1. USER / WEB UI ===== -->
  <rect x="175" y="72" width="250" height="44" rx="22" fill="#8B5CF6" filter="url(#shadow)"/>
  <text x="300" y="99" text-anchor="middle" font-size="15" font-weight="600" fill="white">User / Web UI</text>

  <!-- Arrow: User → Flask -->
  <line x1="300" y1="116" x2="300" y2="146" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="135" font-size="10" fill="#94A3B8" font-style="italic">POST /api/chat</text>

  <!-- ===== 2. FLASK API ===== -->
  <rect x="175" y="148" width="250" height="48" rx="8" fill="#0D9488" filter="url(#shadow)"/>
  <text x="300" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="white">Flask API Endpoint</text>
  <text x="300" y="185" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">/api/chat</text>

  <!-- Arrow: Flask ↔ Database (bidirectional) -->
  <line x1="425" y1="172" x2="548" y2="172" stroke="#F59E0B" stroke-width="1.5"
        marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <text x="487" y="164" text-anchor="middle" font-size="9" fill="#92400E">Load / Save Session</text>

  <!-- Database -->
  <rect x="550" y="148" width="190" height="48" rx="8" fill="#FFFBEB" stroke="#F59E0B"
        stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">Database</text>
  <text x="645" y="185" text-anchor="middle" font-size="10" fill="#B45309">Session State + Chat History</text>

  <!-- Arrow: Flask → Router -->
  <line x1="300" y1="196" x2="300" y2="228" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="216" font-size="9.5" fill="#94A3B8" font-style="italic">question + validated_rows</text>

  <!-- ===== 3. ROUTER AGENT ===== -->
  <rect x="175" y="230" width="250" height="66" rx="8" fill="#3B82F6" filter="url(#shadow)"/>
  <text x="300" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="white">RouterAgent</text>
  <text x="300" y="273" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">
    gemini-2.5-flash-lite · temp=0.0 · max_tokens=350</text>
  <text x="300" y="287" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">
    plan_with_schema() → _normalize_plan()</text>

  <!-- Arrow: Router → Decision -->
  <line x1="300" y1="296" x2="300" y2="323" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="314" font-size="9.5" fill="#94A3B8" font-style="italic">RouterPlan</text>

  <!-- ===== 4. DECISION: needs_clarification? ===== -->
  <polygon points="300,325 415,383 300,441 185,383" fill="#FFF7ED" stroke="#F97316"
           stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="378" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9A3412">
    needs_clarification?</text>
  <text x="300" y="393" text-anchor="middle" font-size="9.5" fill="#C2410C">confidence check</text>

  <!-- Arrow: Decision → Clarification (Yes, right) -->
  <line x1="415" y1="383" x2="543" y2="383" stroke="#EF4444" stroke-width="2"
        marker-end="url(#arrow-red)"/>
  <rect x="442" y="370" width="32" height="16" rx="3" fill="#FEE2E2"/>
  <text x="458" y="382" text-anchor="middle" font-size="10" font-weight="700" fill="#DC2626">Yes</text>

  <!-- Clarification Response box (right) -->
  <rect x="545" y="362" width="225" height="42" rx="8" fill="#FEF2F2" stroke="#FCA5A5"
        stroke-width="1.5" filter="url(#shadow)"/>
  <text x="657" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">
    Return Clarification</text>
  <text x="657" y="395" text-anchor="middle" font-size="9.5" fill="#B91C1C">Ask user to clarify intent</text>

  <!-- Arrow: Decision → Cache (No, down) -->
  <line x1="300" y1="441" x2="300" y2="470" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="258" y="444" width="26" height="16" rx="3" fill="#E0F2FE"/>
  <text x="271" y="456" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">No</text>

  <!-- ===== 5. QUERY CACHE ===== -->
  <rect x="175" y="472" width="250" height="56" rx="8" fill="#10B981" filter="url(#shadow)"/>
  <text x="300" y="495" text-anchor="middle" font-size="14" font-weight="600" fill="white">
    QueryCache (LRU)</text>
  <text x="300" y="510" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.8)">
    key: tool_name + tool_params + data_hash</text>

  <!-- Arrow: Cache → Hit (right) -->
  <line x1="425" y1="500" x2="543" y2="500" stroke="#10B981" stroke-width="2"
        marker-end="url(#arrow-green)"/>
  <rect x="447" y="488" width="28" height="16" rx="3" fill="#D1FAE5"/>
  <text x="461" y="500" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">Hit</text>

  <!-- Cache Hit box (right) -->
  <rect x="545" y="478" width="210" height="42" rx="8" fill="#ECFDF5" stroke="#6EE7B7"
        stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="497" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">
    Return Cached Result</text>
  <text x="650" y="511" text-anchor="middle" font-size="9.5" fill="#047857">Skip HelperAgent entirely</text>

  <!-- Arrow: Cache → Helper (Miss, down) -->
  <line x1="300" y1="528" x2="300" y2="561" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="254" y="530" width="36" height="16" rx="3" fill="#FEF3C7"/>
  <text x="272" y="542" text-anchor="middle" font-size="10" font-weight="700" fill="#D97706">Miss</text>

  <!-- ===== 6. HELPER AGENT ===== -->
  <rect x="175" y="563" width="250" height="66" rx="8" fill="#3B82F6" filter="url(#shadow)"/>
  <text x="300" y="588" text-anchor="middle" font-size="15" font-weight="700" fill="white">HelperAgent</text>
  <text x="300" y="606" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">
    gemini-2.5-flash-lite · temp=0.1 · max_tokens=500</text>
  <text x="300" y="620" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">
    ask_with_routed_tool()</text>

  <!-- Arrow: Helper → Tool1 (down-left) -->
  <line x1="248" y1="629" x2="170" y2="672" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Helper → Tool2 (down-right) -->
  <line x1="352" y1="629" x2="472" y2="672" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OR label between arrows -->
  <rect x="279" y="645" width="42" height="18" rx="4" fill="#E2E8F0"/>
  <text x="300" y="658" text-anchor="middle" font-size="10" font-weight="600" fill="#64748B">OR</text>

  <!-- ===== 7. TOOL 1: spending_breakdown ===== -->
  <rect x="48" y="674" width="236" height="54" rx="8" fill="#7C3AED" filter="url(#shadow)"/>
  <text x="166" y="697" text-anchor="middle" font-size="13" font-weight="600" fill="white">
    spending_breakdown</text>
  <text x="166" y="714" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.8)">
    Single-period · pandas aggregation</text>

  <!-- ===== 8. TOOL 2: compare_spending_periods ===== -->
  <rect x="366" y="674" width="250" height="54" rx="8" fill="#7C3AED" filter="url(#shadow)"/>
  <text x="491" y="697" text-anchor="middle" font-size="13" font-weight="600" fill="white">
    compare_spending_periods</text>
  <text x="491" y="714" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.8)">
    Two-period · pandas comparison</text>

  <!-- Arrow: Tool1 → Synthesis -->
  <line x1="166" y1="728" x2="252" y2="770" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Tool2 → Synthesis -->
  <line x1="491" y1="728" x2="360" y2="770" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Annotation: deterministic -->
  <text x="300" y="753" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">
    Deterministic Python — LLM never computes numbers</text>

  <!-- ===== 9. LLM ANSWER SYNTHESIS ===== -->
  <rect x="175" y="772" width="250" height="52" rx="8" fill="#2563EB" filter="url(#shadow)"/>
  <text x="300" y="795" text-anchor="middle" font-size="14" font-weight="600" fill="white">
    LLM Answer Synthesis</text>
  <text x="300" y="811" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.8)">
    Natural-language answer + chart payload</text>

  <!-- Arrow: Synthesis → Response -->
  <line x1="300" y1="824" x2="300" y2="854" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="843" font-size="9.5" fill="#94A3B8" font-style="italic">cache.put() before return</text>

  <!-- ===== 10. RESPONSE PAYLOAD ===== -->
  <rect x="175" y="856" width="250" height="52" rx="22" fill="#8B5CF6" filter="url(#shadow)"/>
  <text x="300" y="879" text-anchor="middle" font-size="14" font-weight="600" fill="white">
    Response Payload</text>
  <text x="300" y="895" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.8)">
    answer + chart + table + metadata</text>

  <!-- ===== LEGEND ===== -->
  <rect x="598" y="635" width="232" height="140" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="714" y="655" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Legend</text>

  <rect x="612" y="665" width="14" height="14" rx="3" fill="#3B82F6"/>
  <text x="634" y="676" font-size="10" fill="#475569">LLM Agent (Gemini)</text>

  <rect x="612" y="685" width="14" height="14" rx="3" fill="#7C3AED"/>
  <text x="634" y="696" font-size="10" fill="#475569">Tool (Deterministic Python)</text>

  <rect x="612" y="705" width="14" height="14" rx="3" fill="#10B981"/>
  <text x="634" y="716" font-size="10" fill="#475569">Cache Layer</text>

  <rect x="612" y="725" width="14" height="14" rx="3" fill="#F97316"/>
  <text x="634" y="736" font-size="10" fill="#475569">Decision Point</text>

  <rect x="612" y="745" width="14" height="14" rx="3" fill="#8B5CF6"/>
  <text x="634" y="756" font-size="10" fill="#475569">Entry / Exit</text>

</svg>
